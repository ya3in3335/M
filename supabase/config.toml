# Only the settings MED-K relies on. Merge with your existing config.toml if you have one.
[functions.auth-bootstrap]
verify_jwt = false   # the function verifies the Firebase ID token itself

[functions.admin-staff]
verify_jwt = false   # the function verifies the Firebase ID token + owner role itself

# Third-party auth: Supabase accepts Firebase ID tokens for PostgREST/Storage/Realtime.
[auth.third_party.firebase]
enabled = true
project_id = "env(FIREBASE_PROJECT_ID)"

name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Firebase backend: compile Cloud Functions + run security tests on the emulators.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: firebase } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Build Cloud Functions
        run: npm ci --prefix functions && npm run build --prefix functions
      - name: Security rules + functions tests (emulators)
        run: |
          printf 'ENFORCE_APP_CHECK=false\nOWNER_EMAILS=owner@test.dev\n' > functions/.env.local
          npm ci --prefix tests
          cd tests && npx firebase emulators:exec --project demo-medk --config ../firebase.json --only auth,firestore,storage,functions "npm test"

  # Manual deployment of rules, indexes and functions (Actions → Run workflow).
  deploy-backend:
    if: github.event_name == 'workflow_dispatch'
    needs: backend
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: firebase } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Deploy to Firebase
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          printf 'OWNER_EMAILS=%s\nENFORCE_APP_CHECK=true\n' "$OWNER_EMAILS" > "functions/.env.$PROJECT"
          npm ci --prefix functions
          npx --yes firebase-tools@13 deploy --only firestore,storage,functions --project "$PROJECT" --non-interactive --force
          rm -f "$RUNNER_TEMP/sa.json"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Public client configuration only (GitHub Secrets).
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            echo "google-services.json written"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — the APK will show a 'not configured' screen."
          fi

      - name: Release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/medk.jks"
            echo "MEDK_KEYSTORE_PATH=$RUNNER_TEMP/medk.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release keystore — the AAB will be unsigned."
          fi

      - name: Kotlin compilation
        run: ./gradlew :app:compileStoreProdDebugKotlin :app:compileAdminProdDebugKotlin :app:compileStoreDemoDebugKotlin :app:compileAdminDemoDebugKotlin --stacktrace

      - name: Unit & screenshot tests
        run: ./gradlew :app:testStoreProdDebugUnitTest :app:testStoreDemoDebugUnitTest :app:testAdminDemoDebugUnitTest --stacktrace

      - name: Build debug APKs (store + admin, prod + demo)
        run: ./gradlew :app:assembleStoreProdDebug :app:assembleStoreDemoDebug :app:assembleAdminProdDebug :app:assembleAdminDemoDebug --stacktrace

      - name: Build release AAB
        env:
          MEDK_KEYSTORE_PASSWORD: ${{ secrets.MEDK_KEYSTORE_PASSWORD }}
          MEDK_KEY_ALIAS: ${{ secrets.MEDK_KEY_ALIAS }}
          MEDK_KEY_PASSWORD: ${{ secrets.MEDK_KEY_PASSWORD }}
        run: ./gradlew :app:bundleStoreProdRelease :app:bundleAdminProdRelease :app:assembleStoreProdRelease --stacktrace

      - name: Remove secrets from workspace
        if: always()
        run: rm -f app/google-services.json "$RUNNER_TEMP/medk.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: MED-K-store-apk
          path: app/build/outputs/apk/storeProd/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MED-K-ADMIN-apk
          path: app/build/outputs/apk/adminProd/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MED-K-DEMO-apks
          path: |
            app/build/outputs/apk/storeDemo/debug/*.apk
            app/build/outputs/apk/adminDemo/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MED-K-release-aab
          path: app/build/outputs/bundle/*Release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: MED-K-release-apk
          path: app/build/outputs/apk/storeProd/release/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore

name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Firebase backend (free Spark plan): security-rules tests on the Firestore emulator.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: firebase/tests } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Security rules tests (emulator)
        run: |
          npm ci
          npm run rules
          npx firebase emulators:exec --project demo-medk --config ../firebase.json --only firestore "npm test"

      - name: Push server tests (offline, mocked Google APIs)
        working-directory: firebase/push-worker
        run: node test/worker.test.mjs

  # Manual deployment of rules + indexes (Actions → Run workflow). Works on the free plan.
  deploy-backend:
    if: github.event_name == 'workflow_dispatch'
    needs: backend
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: firebase } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Deploy Firestore rules and indexes
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          LIST=$(echo "$OWNER_EMAILS" | tr 'A-Z' 'a-z' | tr -d ' ' | awk -F, '{for(i=1;i<=NF;i++) if($i!="") printf "%s\x27%s\x27", (n++?",":""), $i}')
          sed "s/__OWNER_EMAILS__/[$LIST]/" firestore.rules.tmpl > firestore.rules
          npx --yes firebase-tools@13 deploy --only firestore --project "$PROJECT" --non-interactive --force
          rm -f "$RUNNER_TEMP/sa.json"

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the GitHub Release used by in-app updates
    timeout-minutes: 45
    env:
      # Public client configuration only (GitHub Secrets).
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            echo "google-services.json written"
          else
            echo "Using committed app/google-services.json"
          fi

      - name: Release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/medk.jks"
            echo "MEDK_KEYSTORE_PATH=$RUNNER_TEMP/medk.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release keystore — the AAB will be unsigned."
          fi

      - name: Kotlin compilation
        run: ./gradlew :app:compileStoreProdDebugKotlin :app:compileAdminProdDebugKotlin :app:compileStoreDemoDebugKotlin :app:compileAdminDemoDebugKotlin --stacktrace

      - name: Cache Robolectric Android jars
        uses: actions/cache@v4
        with:
          path: ~/robolectric-jars
          key: robolectric-jars-14-15-i7

      - name: Download Robolectric Android jars (with retries)
        run: |
          mkdir -p ~/robolectric-jars && cd ~/robolectric-jars
          base=https://maven.google.com/org/robolectric/android-all-instrumented
          for v in 14-robolectric-10818077-i7 15-robolectric-12650502-i7; do
            f=android-all-instrumented-$v.jar
            [ -s "$f" ] && continue
            for m in "$base" https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented; do
              curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$f" "$m/$v/$f" && break
            done
            [ -s "$f" ] || { echo "::error::could not download $f"; exit 1; }
          done
          ls -la

      - name: Unit & screenshot tests
        run: ./gradlew :app:testStoreProdDebugUnitTest :app:testStoreDemoDebugUnitTest :app:testAdminDemoDebugUnitTest -ProbolectricDepsDir=$HOME/robolectric-jars --stacktrace


      - name: Build release APKs + AAB
        env:
          MEDK_KEYSTORE_PASSWORD: ${{ secrets.MEDK_KEYSTORE_PASSWORD }}
          MEDK_KEY_ALIAS: ${{ secrets.MEDK_KEY_ALIAS }}
          MEDK_KEY_PASSWORD: ${{ secrets.MEDK_KEY_PASSWORD }}
        # optimized (R8 + resource shrinking) APKs ~5 MB — these are what users install and update to
        run: ./gradlew :app:bundleStoreProdRelease :app:bundleAdminProdRelease :app:assembleStoreProdRelease :app:assembleAdminProdRelease :app:assembleStoreDemoRelease :app:assembleAdminDemoRelease --stacktrace

      - name: Remove secrets from workspace
        if: always()
        run: rm -f "$RUNNER_TEMP/medk.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: MED-K-store-apk
          path: app/build/outputs/apk/storeProd/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MED-K-ADMIN-apk
          path: app/build/outputs/apk/adminProd/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MED-K-DEMO-apks
          path: |
            app/build/outputs/apk/storeDemo/release/*.apk
            app/build/outputs/apk/adminDemo/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MED-K-release-aab
          path: app/build/outputs/bundle/*Release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: MED-K-release-apk
          path: app/build/outputs/apk/storeProd/release/*.apk

      # In-app updates: every push publishes a Release "v1.0.<run>" whose asset names
      # match BuildConfig.UPDATE_ASSET of each variant. All builds share app/keys/medk-debug.keystore,
      # so each APK installs as an update over the previous one.
      - name: Prepare release assets
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/storeProd/release/*.apk dist/MED-K.apk
          cp app/build/outputs/apk/adminProd/release/*.apk dist/MED-K-Admin.apk
          cp app/build/outputs/apk/storeDemo/release/*.apk dist/MED-K-Demo.apk
          cp app/build/outputs/apk/adminDemo/release/*.apk dist/MED-K-Admin-Demo.apk

      - name: Publish release (in-app update source)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MED-K 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            MED-K 1.0.${{ github.run_number }}
            ${{ github.event.head_commit.message }}
          files: dist/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore

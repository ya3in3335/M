name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Public client configuration (GitHub Secrets). Never put a service_role key here.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            echo "google-services.json written"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — the APK will show a 'not configured' screen."
          fi

      - name: Release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/medk.jks"
            echo "MEDK_KEYSTORE_PATH=$RUNNER_TEMP/medk.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release keystore — the AAB will be unsigned."
          fi

      - name: Kotlin compilation
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Unit & screenshot tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release AAB
        env:
          MEDK_KEYSTORE_PASSWORD: ${{ secrets.MEDK_KEYSTORE_PASSWORD }}
          MEDK_KEY_ALIAS: ${{ secrets.MEDK_KEY_ALIAS }}
          MEDK_KEY_PASSWORD: ${{ secrets.MEDK_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Remove secrets from workspace
        if: always()
        run: rm -f app/google-services.json "$RUNNER_TEMP/medk.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: MED-K-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MED-K-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: MED-K-release-apk
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore
